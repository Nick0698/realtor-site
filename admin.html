<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админка — объекты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Админ-панель</h1>
        <p>Управление объектами недвижимости</p>
    </header>

    <section>
        <h2>Добавить объект</h2>
        <form id="objectForm">
            <input type="text" id="title" placeholder="Название (2-к квартира, 60 м²)" required>
            <input type="text" id="address" placeholder="Адрес" required>
            <input type="text" id="price" placeholder="Цена (8 500 000 ₽)" required>
            <textarea id="description" placeholder="Описание"></textarea>
            <input type="text" id="image" placeholder="Ссылка на фото (URL)">
            <button type="submit">➕ Добавить объект</button>
        </form>
    </section>

    <section>
        <h2>Список объектов</h2>
        <div id="adminList" class="cards"></div>
    </section>

    <section>
        <h2>Сохранить изменения</h2>
        <p>Нажми кнопку, чтобы скачать обновлённый <code>data.json</code>:</p>
        <button id="downloadBtn">💾 Скачать data.json</button>
    </section>

    <footer>
        <a href="index.html">← Вернуться на сайт</a>
    </footer>

    <script src="admin.js"></script>
</body>
</html>
